[project]
name = "reforma-backend"
version = "1.0.0"
description = "Auditor fiscal de cadastros para a Reforma Tributária (LC 214/2025)"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.8.0",
    "argon2-cffi==25.1.0",
    "beautifulsoup4==4.15.0",
    "celery==5.6.3",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "fastexcel==0.21.0",
    "flower==2.2.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "orjson==3.12.0",
    "pgvector==0.5.0",
    "polars==1.44.2",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.1",
    "sse-starlette==3.4.11",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
    "weasyprint==70.0",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = [
    "celery-types==0.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008", "S608", "SIM103", "SIM105", "SIM108", "SIM118"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
